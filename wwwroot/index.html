    <style>
      #kf-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #fff;
        color: #20211e;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        transition: opacity .6s ease, visibility .6s ease;
      }
      #kf-loader.kf-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #kf-loader .kf-stack { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #kf-loader .kf-word { font-size: 20px; font-weight: 400; letter-spacing: -.04em; }
      #kf-loader .kf-loading-line { width: 88px; height: 2px; overflow: hidden; background: #eeeee9; }
      #kf-loader .kf-loading-line::after {
        content: "";
        display: block;
        width: 32px;
        height: 100%;
        background: #6978cc;
        animation: kf-loading-line 1.5s ease-in-out infinite;
      }
      @keyframes kf-loading-line {
        0% { transform: translateX(-32px); }
        100% { transform: translateX(88px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #kf-loader { transition: none; }
        #kf-loader .kf-loading-line::after { animation: none; transform: translateX(28px); }
      }
    </style>

    <script>
      (function () {
        var loader = document.getElementById('kf-loader');
        if (!loader) return;
        var MIN_MS = 2500;
        var MAX_MS = 8000;
        var started = performance.now();

        function hide() {
          var elapsed = performance.now() - started;
          var wait = Math.max(0, MIN_MS - elapsed);
          setTimeout(function () {
            document.body.classList.add('kf-app-visible');
            loader.classList.add('kf-hide');
          }, wait);
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
        setTimeout(hide, MAX_MS);
      })();
    </script>
